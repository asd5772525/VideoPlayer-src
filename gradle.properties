# ---- 构建速度 ----
# 守护进程堆内存：R8 + Compose 编译 3GB 足够；ParallelGC 吞吐更高
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存：第二次起跳过整个配置阶段（构建脚本只读 -P 参数和环境变量，可安全缓存）
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
kotlin.code.style=official
