name: 播放源测速与清理

on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时
  workflow_dispatch:
    inputs:
      rebuild:
        description: '测速后顺便编译发布（默认不勾：测速只保存结果，App 要等你在后台点「编译发布」才更新）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: source-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 并发测速所有播放源与解析接口
        id: check
        run: python3 scripts/check_sources.py

      - name: 提交结果
        id: commit
        shell: bash
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json removed.json config.json
          if git diff --cached --quiet; then echo "无变化"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "chore: 播放源测速结果 [skip ci]"
          # 编译任务可能刚把 update.json 提交回来，推送前先 rebase，失败重试
          PUSHED=false
          for _ in 1 2 3; do
            if git pull --rebase origin "$BRANCH" && git push; then PUSHED=true; break; fi
            sleep 5
          done
          echo "pushed=$PUSHED" >> "$GITHUB_OUTPUT"
          # 三次都没推上去：标红，让人看到（不再误报 pushed=true 去触发编译）
          [ "$PUSHED" = true ] || { echo "::error::推送测速结果失败（重试 3 次）"; exit 1; }

      # 测速只保存结果（status.json / removed.json / config.json 的排序与移除，提交带 [skip ci]），默认不编译。
      # 定时测速永远不编译；只有在 Actions 页面手动运行并勾选 rebuild 时才会触发编译发布。
      - name: 手动勾选了 rebuild 且源列表有变化 → 触发编译发布
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild && steps.check.outputs.config_changed == 'true' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # 通过环境变量传递，避免源名称里的引号 / $() 被当成 shell 代码执行
          SUMMARY: ${{ steps.check.outputs.summary }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run build.yml --ref "$BRANCH" -f release=true -f changelog="$SUMMARY"
